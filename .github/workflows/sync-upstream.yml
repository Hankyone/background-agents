name: Sync Upstream

# Keeps this fork's `main` current with the upstream repository, and — crucially —
# makes sure the running deployment is redeployed after a sync so the live app is
# always up to date. When upstream can't be merged automatically, the run fails so
# GitHub emails the repo owner; merge upstream into main by hand to clear it.
#
# Why the explicit deploy dispatch: pushes made with the default GITHUB_TOKEN do NOT
# trigger other workflows (GitHub's recursion guard). So a plain `git push` here would
# update the repo but never run the Terraform deploy. `workflow_dispatch` is the
# documented exception that GITHUB_TOKEN *is* allowed to trigger, so we use it.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write # push the merged main
  actions: write # dispatch the Terraform deploy workflow, keep this workflow enabled

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  # In a fork checkout, `gh` defaults to the *parent* repo (ColeMurray/…). Pinning
  # GH_REPO points every gh call in this workflow at the fork.
  GH_REPO: ${{ github.repository }}
  UPSTREAM_URL: https://github.com/ColeMurray/background-agents.git
  UPSTREAM_BRANCH: main
  DEPLOY_WORKFLOW: terraform.yml
  SYNC_WORKFLOW: sync-upstream.yml

jobs:
  sync:
    name: Sync main from upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
      UPSTREAM_SYNC_TOKEN_CONFIGURED: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$UPSTREAM_BRANCH"

      - name: Merge upstream into main
        id: merge
        run: |
          set -euo pipefail
          git checkout main
          before="$(git rev-parse HEAD)"

          # Nothing new upstream -> done.
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already up to date with upstream."
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            git diff --name-only "$before" HEAD > changed-paths.txt
            if git push origin main; then
              echo "Merged upstream cleanly."
              echo "status=merged" >> "$GITHUB_OUTPUT"
            else
              git reset --hard "$before"
              echo "status=blocked" >> "$GITHUB_OUTPUT"
              echo "reason=Upstream merged cleanly but GitHub rejected the push (check UPSTREAM_SYNC_TOKEN can write contents and workflow files)" >> "$GITHUB_OUTPUT"
            fi
          else
            conflicts="$(git diff --name-only --diff-filter=U | paste -sd ' ' -)"
            git merge --abort
            echo "status=blocked" >> "$GITHUB_OUTPUT"
            echo "reason=Upstream conflicts with this fork in: $conflicts" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy after clean sync
        if: steps.merge.outputs.status == 'merged'
        run: |
          set -euo pipefail
          # Only redeploy when the synced changes touch something the deploy cares about
          # (mirrors the path filter in terraform.yml). Doc-only syncs skip the deploy.
          if grep -qE '^(terraform/|scripts/|packages/|\.github/workflows/terraform\.yml$)' changed-paths.txt; then
            if [ "$UPSTREAM_SYNC_TOKEN_CONFIGURED" = "true" ]; then
              echo "Deploy-relevant changes detected; push used UPSTREAM_SYNC_TOKEN, so the push event will trigger $DEPLOY_WORKFLOW."
              exit 0
            fi
            echo "Deploy-relevant changes detected; dispatching $DEPLOY_WORKFLOW."
            gh workflow run "$DEPLOY_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "No deploy-relevant paths changed; skipping deploy."
          fi

      - name: Email the owner about a blocked sync
        if: steps.merge.outputs.status == 'blocked'
        env:
          REASON: ${{ steps.merge.outputs.reason }}
        run: |
          set -euo pipefail
          # A failed run is what makes GitHub email the owner. Fail at most once a day,
          # so a sync that stays blocked sends a daily reminder rather than an hourly one.
          last_failure="$(gh run list --workflow "$SYNC_WORKFLOW" --status failure --limit 1 --json createdAt --jq '.[0].createdAt // empty')"
          if [ -n "$last_failure" ] && [ "$(date -d "$last_failure" +%s)" -gt "$(date -d '24 hours ago' +%s)" ]; then
            echo "Still blocked; the owner was already emailed in the last day. $REASON."
            exit 0
          fi
          echo "::error title=Upstream sync needs a manual merge::$REASON. Merge upstream/$UPSTREAM_BRANCH into main by hand and push; the push redeploys."
          exit 1

      # GitHub disables scheduled workflows after 60 days without repository activity.
      # While a sync is blocked this workflow makes no commits, so re-enable it on every
      # run to reset that clock.
      - name: Keep this workflow enabled
        if: always()
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$SYNC_WORKFLOW/enable"
